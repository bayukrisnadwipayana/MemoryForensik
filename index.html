<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman Sederhana</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      background-color: #f2f2f2;
    }
    header {
      background-color: #4CAF50;
      color: white;
      padding: 20px 0;
    }
    main {
      padding: 20px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #45a049;
    }
    footer {
      background-color: #ddd;
      padding: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Selamat Datang di Halaman Saya</h1>
  </header>

  <main>
    <p>Ini adalah halaman HTML sederhana yang dibuat sebagai contoh.</p>
    <img src="https://via.placeholder.com/300" alt="Contoh Gambar" style="max-width: 100%; height: auto;">
    <p>
      <button onclick="alert('Terima kasih sudah klik tombol!')">Klik Saya</button>
    </p>
  </main>

  <footer>
    <p>Hak Cipta &copy; 2025</p>
  </footer>

</body>
</html>
